name: _run (reusable)

# Shared run logic for every fleet. Called by run-support / run-stripe_support / run-claims / run-crm /
# run-travel / run-revops / run-claims_payout / run-legal so the pipeline
# lives in one place. Not directly dispatchable — the per-fleet callers are. The fleet's ingest key
# comes in as an input (passed by the Sim Control app at kick time); the only secret is GROQ_API_KEY.
on:
  workflow_call:
    inputs:
      pack:       { required: true,  type: string }
      ingest_key: { required: true,  type: string }
      # Simulated fleets belong on pre-prod, which provydev serves. Production holds real customer
      # data only. Pointing this at provyai would create the fleet in one database and send its runs
      # to the other, where the ingest key does not exist, so every call 401s while provisioning
      # still reports success.
      provy_url:  { required: false, type: string,  default: 'https://provydev.vercel.app' }
      count:      { required: false, type: string,  default: '8' }
      seed:       { required: false, type: string,  default: '1' }
      reconcile:  { required: false, type: boolean, default: true }
      # Outcomes stream in every N runs instead of only after the whole batch, so Provy's trust score
      # and divergence surfaces fill in DURING a run rather than saying nothing until it ends (#3).
      # 0 restores the old post-everything-at-the-end behaviour.
      reconcile_every: { required: false, type: string, default: '4' }
      workflow_id: { required: false, type: string, default: '' }  # so the run posts its summary to the console
    secrets:
      GROQ_API_KEY: { required: true }
      # provydev sits behind Vercel SSO, so a headless run needs the protection-bypass token to
      # reach the ingest routes at all. Without it every emit gets the SSO redirect, not the API.
      VERCEL_PROTECTION_BYPASS: { required: false }

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run batch (emit + reconcile)
        env:
          PROVY_EMIT: '1'
          PROVY_URL: ${{ inputs.provy_url }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # The runner resolves the pack's key from PROVY_KEY_<PACK> (config/workflows.py). Only the
          # selected pack's variable is set, from the caller's input.
          PROVY_KEY_SUPPORT: ${{ inputs.pack == 'support' && inputs.ingest_key || '' }}
          PROVY_KEY_STRIPE_SUPPORT: ${{ inputs.pack == 'stripe_support' && inputs.ingest_key || '' }}
          PROVY_KEY_CLAIMS:  ${{ inputs.pack == 'claims'  && inputs.ingest_key || '' }}
          PROVY_KEY_CRM:     ${{ inputs.pack == 'crm'     && inputs.ingest_key || '' }}
          PROVY_KEY_TRAVEL:  ${{ inputs.pack == 'travel'  && inputs.ingest_key || '' }}
          PROVY_KEY_REVOPS:  ${{ inputs.pack == 'revops'  && inputs.ingest_key || '' }}
          PROVY_KEY_CLAIMS_PAYOUT: ${{ inputs.pack == 'claims_payout' && inputs.ingest_key || '' }}
          PROVY_KEY_LEGAL:   ${{ inputs.pack == 'legal'   && inputs.ingest_key || '' }}
          PROVY_KEY_ITSM:    ${{ inputs.pack == 'itsm'    && inputs.ingest_key || '' }}
          # ITSM works real tickets in a real ServiceNow instance. No credentials,
          # no run: the pack has no offline mode on purpose.
          SERVICENOW_INSTANCE: ${{ secrets.SERVICENOW_INSTANCE }}
          SERVICENOW_USER: ${{ secrets.SERVICENOW_USER }}
          SERVICENOW_PASSWORD: ${{ secrets.SERVICENOW_PASSWORD }}
          # Post the injected-truth summary back to the console scoreboard (best-effort, offline-safe).
          CONTROL_URL: ${{ secrets.CONTROL_URL }}
          CONTROL_LEVERS_TOKEN: ${{ secrets.CONTROL_LEVERS_TOKEN }}
          CONTROL_WORKFLOW_ID: ${{ inputs.workflow_id }}
        run: |
          python scripts/run_batch.py \
            --pack "${{ inputs.pack }}" \
            --count "${{ inputs.count }}" \
            --seed "${{ inputs.seed }}" \
            ${{ inputs.reconcile && '--reconcile' || '' }} \
            --reconcile-every "${{ inputs.reconcile_every }}"
