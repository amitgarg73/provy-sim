name: run-edwin

# Dispatchable run for the Edwin (agentic AIOps) fleet. The Sim Control app triggers this via the
# GitHub API and passes the fleet's ingest key + Provy URL. Shares logic with the other fleets via
# _run.yml.
#
# Self-contained pack: it invents its own insights and settles them, so it needs neither `pace`
# (no system of record keeping its own clock) nor `concurrency` (no real waiting inside a run).
on:
  workflow_dispatch:
    inputs:
      ingest_key: { description: 'Provy ingest key (provy_...) for the Edwin fleet', required: true,  type: string }
      provy_url:  { description: 'Provy ingest base URL', required: false, type: string, default: 'https://provydev.vercel.app' }
      count:      { description: 'Work items (investigations) to run', required: false, type: string, default: '8' }
      seed:       { description: 'RNG seed (deterministic run)', required: false, type: string, default: '1' }
      reconcile:  { description: 'Post the real outcomes after the run', required: false, type: boolean, default: true }
      workflow_id: { description: 'Fleet workflow id (for scoreboard posting)', required: false, type: string, default: '' }

jobs:
  run:
    uses: ./.github/workflows/_run.yml
    with:
      pack: edwin
      ingest_key: ${{ inputs.ingest_key }}
      provy_url: ${{ inputs.provy_url }}
      count: ${{ inputs.count }}
      seed: ${{ inputs.seed }}
      reconcile: ${{ inputs.reconcile }}
      workflow_id: ${{ inputs.workflow_id }}
    secrets: inherit
