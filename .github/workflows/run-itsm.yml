name: run-itsm

# Dispatchable run for the ITSM fleet. Unlike every other fleet, this one works real
# incidents in a real ServiceNow instance, so it needs the SERVICENOW_* secrets and it
# never reconciles: ServiceNow settles the outcome and pushes it to Provy itself.
on:
  workflow_dispatch:
    inputs:
      ingest_key: { description: 'Provy ingest key (provy_...) for the ITSM fleet', required: true, type: string }
      provy_url:  { description: 'Provy ingest base URL', required: false, type: string, default: 'https://provydev.vercel.app' }
      count:      { description: 'Incidents to work in this run', required: false, type: string, default: '10' }
      seed:       { description: 'RNG seed (deterministic agent behaviour)', required: false, type: string, default: '1' }
      # Not optional for this fleet, which is why it defaults to a real value rather than 0. The
      # response-target condition can only breach if the backlog ages while the agent works it; on an
      # unpaced run every ticket is answered within seconds, nothing breaches, and the one condition
      # that carries the demo grades nothing.
      pace:       { description: 'Seconds between incidents, so the backlog ages and SLAs can breach', required: false, type: string, default: '20' }
      # Tickets arrive while the agent works instead of all landing at once. The gap defaults to
      # roughly the time the agent takes per incident (pace plus about 15s of work), so the queue
      # hovers rather than emptying or piling up, and the wait varies per ticket.
      opening_backlog: { description: 'Incidents waiting when the run starts; the rest arrive during it', required: false, type: string, default: '2' }
      arrival_gap:     { description: 'Average seconds between arrivals (random, not fixed)', required: false, type: string, default: '35' }
      # spread, not benchmark: a real desk is 94% P3, which in a compressed demo means one response
      # target for the whole batch. A spread exercises all four targets, so the same delay passes one
      # ticket and breaches another. The benchmark figure stays quotable alongside it.
      priority_mix:    { description: 'spread (all four targets exercised) or benchmark (94% P3, as measured)', required: false, type: string, default: 'spread' }
      # Declared but IGNORED. The Sim Control console sends this input to every fleet, and
      # GitHub rejects a dispatch carrying an input the workflow does not declare, so the
      # console's Kick run button would 422 without it. The value is discarded below: this
      # fleet's outcomes come from ServiceNow and the simulation has none to post.
      reconcile:  { description: 'Ignored for ITSM: ServiceNow settles and pushes the outcome', required: false, type: boolean, default: false }
      workflow_id: { description: 'Fleet workflow id (for scoreboard posting)', required: false, type: string, default: '' }

jobs:
  run:
    uses: ./.github/workflows/_run.yml
    with:
      pack: itsm
      ingest_key: ${{ inputs.ingest_key }}
      provy_url: ${{ inputs.provy_url }}
      count: ${{ inputs.count }}
      seed: ${{ inputs.seed }}
      pace: ${{ inputs.pace }}
      opening_backlog: ${{ inputs.opening_backlog }}
      arrival_gap: ${{ inputs.arrival_gap }}
      priority_mix: ${{ inputs.priority_mix }}
      # Not an option for this fleet. The simulation has no outcome to post.
      reconcile: false
      workflow_id: ${{ inputs.workflow_id }}
    secrets: inherit
